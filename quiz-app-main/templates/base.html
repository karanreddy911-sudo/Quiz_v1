<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quiz App{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('home') }}">Quiz App</a>
    {% if current_user %}
    <nav>
      <span>Hi, <strong>{{ current_user }}</strong></span>
      <a href="{{ url_for('subjects') }}">Subjects</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Built with Git, GitHub, Jenkins &amp; Docker &middot; Build: <strong>{{ app_version }}</strong>
  </footer>
</body>
</html>
